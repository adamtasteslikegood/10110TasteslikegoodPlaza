<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: sans-serif; }
    .t  { font-size: 14px; fill: #3d3d3a; }
    .ts { font-size: 12px; fill: #73726c; }
    .th { font-size: 14px; font-weight: 500; fill: #3d3d3a; }

    /* c-gray */
    .c-gray > rect, .c-gray > ellipse, .c-gray > circle { fill: #F1EFE8; stroke: #5F5E5A; }
    .c-gray .th { fill: #2C2C2A; }
    .c-gray .ts { fill: #5F5E5A; }

    /* c-teal */
    .c-teal > rect, .c-teal > ellipse, .c-teal > circle { fill: #E1F5EE; stroke: #0F6E56; }
    .c-teal .th { fill: #04342C; }
    .c-teal .ts { fill: #0F6E56; }

    /* c-blue */
    .c-blue > rect, .c-blue > ellipse, .c-blue > circle { fill: #E6F1FB; stroke: #185FA5; }
    .c-blue .th { fill: #042C53; }
    .c-blue .ts { fill: #185FA5; }

    /* c-purple */
    .c-purple > rect, .c-purple > ellipse, .c-purple > circle { fill: #EEEDFE; stroke: #534AB7; }
    .c-purple .th { fill: #26215C; }
    .c-purple .ts { fill: #534AB7; }

    /* c-amber */
    .c-amber > rect, .c-amber > ellipse, .c-amber > circle { fill: #FAEEDA; stroke: #854F0B; }
    .c-amber .th { fill: #412402; }
    .c-amber .ts { fill: #854F0B; }

    /* c-coral */
    .c-coral > rect, .c-coral > ellipse, .c-coral > circle { fill: #FAECE7; stroke: #993C1D; }
    .c-coral .th { fill: #4A1B0C; }
    .c-coral .ts { fill: #993C1D; }

    .arr { stroke: #888780; stroke-width: 1.5; fill: none; }
  </style>
</defs>

<!-- Layer labels (left margin) -->
<text class="ts" x="32" y="96"  text-anchor="middle" dominant-baseline="central">Layer 4</text>
<text class="ts" x="32" y="200" text-anchor="middle" dominant-baseline="central">Layer 3</text>
<text class="ts" x="32" y="318" text-anchor="middle" dominant-baseline="central">Layer 2</text>
<text class="ts" x="32" y="460" text-anchor="middle" dominant-baseline="central">Layer 1</text>

<!-- LAYER 4: Real agent execution -->
<g class="c-gray">
  <rect x="60" y="56" width="580" height="80" rx="10" stroke-width="0.5"/>
  <text class="th" x="350" y="82"  text-anchor="middle" dominant-baseline="central">Real agent execution</text>
  <text class="ts" x="350" y="102" text-anchor="middle" dominant-baseline="central">claude-code, gemini-cli, MCP servers, SSH, tty — already exists, not built by this project</text>
</g>

<!-- LAYER 3: I/O bridge -->
<g class="c-teal">
  <rect x="60" y="158" width="580" height="84" rx="10" stroke-width="0.5"/>
  <text class="th" x="350" y="184" text-anchor="middle" dominant-baseline="central">I/O bridge  (Phase 2)</text>
  <text class="ts" x="350" y="204" text-anchor="middle" dominant-baseline="central">stdin / stdout / stderr pipe — WebSocket server or named pipe — feeds game world</text>
</g>

<!-- LAYER 2: Godot engine -->
<g class="c-blue">
  <rect x="60" y="264" width="580" height="108" rx="10" stroke-width="0.5"/>
  <text class="th" x="350" y="288" text-anchor="middle" dominant-baseline="central">Godot 4 engine  (prototype target)</text>
</g>
<!-- Sub-blocks inside Godot layer -->
<g class="c-purple">
  <rect x="76"  y="300" width="120" height="56" rx="6" stroke-width="0.5"/>
  <text class="th" x="136" y="320" text-anchor="middle" dominant-baseline="central">World / map</text>
  <text class="ts" x="136" y="340" text-anchor="middle" dominant-baseline="central">Rooms, floors, nav</text>
</g>
<g class="c-purple">
  <rect x="212" y="300" width="120" height="56" rx="6" stroke-width="0.5"/>
  <text class="th" x="272" y="320" text-anchor="middle" dominant-baseline="central">NPC system</text>
  <text class="ts" x="272" y="340" text-anchor="middle" dominant-baseline="central">Characters + roles</text>
</g>
<g class="c-purple">
  <rect x="348" y="300" width="120" height="56" rx="6" stroke-width="0.5"/>
  <text class="th" x="408" y="320" text-anchor="middle" dominant-baseline="central">Player + HUD</text>
  <text class="ts" x="408" y="340" text-anchor="middle" dominant-baseline="central">FP controller, UI</text>
</g>
<g class="c-purple">
  <rect x="484" y="300" width="140" height="56" rx="6" stroke-width="0.5"/>
  <text class="th" x="554" y="320" text-anchor="middle" dominant-baseline="central">Event bus</text>
  <text class="ts" x="554" y="340" text-anchor="middle" dominant-baseline="central">Tasks, unlocks, chat</text>
</g>

<!-- LAYER 1: Data / config -->
<g class="c-amber">
  <rect x="60" y="396" width="580" height="128" rx="10" stroke-width="0.5"/>
  <text class="th" x="350" y="420" text-anchor="middle" dominant-baseline="central">Data + config layer</text>
</g>
<g class="c-coral">
  <rect x="76"  y="432" width="156" height="76" rx="6" stroke-width="0.5"/>
  <text class="th" x="154" y="455" text-anchor="middle" dominant-baseline="central">Employee directory</text>
  <text class="ts" x="154" y="474" text-anchor="middle" dominant-baseline="central">137+ roles as JSON</text>
  <text class="ts" x="154" y="492" text-anchor="middle" dominant-baseline="central">from .md files</text>
</g>
<g class="c-coral">
  <rect x="248" y="432" width="156" height="76" rx="6" stroke-width="0.5"/>
  <text class="th" x="326" y="455" text-anchor="middle" dominant-baseline="central">Scene / story data</text>
  <text class="ts" x="326" y="474" text-anchor="middle" dominant-baseline="central">Dialogue, unlocks</text>
  <text class="ts" x="326" y="492" text-anchor="middle" dominant-baseline="central">tutorial gates</text>
</g>
<g class="c-coral">
  <rect x="420" y="432" width="204" height="76" rx="6" stroke-width="0.5"/>
  <text class="th" x="522" y="455" text-anchor="middle" dominant-baseline="central">Player profile</text>
  <text class="ts" x="522" y="474" text-anchor="middle" dominant-baseline="central">Progress, unlocks</text>
  <text class="ts" x="522" y="492" text-anchor="middle" dominant-baseline="central">config, preferences</text>
</g>

<!-- Arrows between layers -->
<line x1="350" y1="136" x2="350" y2="156" class="arr" stroke="#1D9E75" marker-end="url(#arrow)"/>
<line x1="350" y1="242" x2="350" y2="262" class="arr" stroke="#378ADD" marker-end="url(#arrow)"/>
<line x1="350" y1="372" x2="350" y2="394" class="arr" stroke="#BA7517" marker-end="url(#arrow)"/>

<!-- Phase labels (right margin) -->
<text class="ts" x="648" y="200" text-anchor="start" dominant-baseline="central" fill="#0F6E56">Phase 2</text>
<text class="ts" x="648" y="318" text-anchor="start" dominant-baseline="central" fill="#185FA5">Phase 1</text>
<text class="ts" x="648" y="460" text-anchor="start" dominant-baseline="central" fill="#854F0B">Now</text>
</svg>
