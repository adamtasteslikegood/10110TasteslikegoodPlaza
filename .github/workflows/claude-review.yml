# Independent Claude review — advisory, cost-optimized, fail-open.
# Full review on open/ready/label/dispatch; low-effort unreviewed delta on push.
# Verified fixes are committed to the PR branch and explained in comments.
# Protected specification decisions still require the owner's direction.
#
# Set CLAUDE_CODE_OAUTH_TOKEN (preferred) or ANTHROPIC_API_KEY in Actions secrets.
# CLAUDE_REVIEW_MODEL overrides the supplied default, claude-opus-4-7.
# The Claude App token supplied through OIDC is separate from model credentials.
#
# This workflow cannot review changes to itself until they reach the default
# branch: the action may skip workflow validation and still report a green step.
# Only its genuine success output creates a completed-review checkpoint below.

name: Claude Review (independent model)

on:
  pull_request:
    types: [opened, ready_for_review, labeled, synchronize]
    branches: [main, dev, 'dev/**']
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  review:
    name: Independent Claude review
    # Bot fix pushes must not start an automatic review loop. Dispatch targets
    # are checked separately before checkout, including their repository/state.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.sender.type != 'Bot' &&
        (github.event.action != 'labeled' || github.event.label.name == 'claude-review')
      )
    # Evaluate job eligibility before concurrency: a skipped bot fix push or
    # unrelated label must not cancel the human-triggered review that is running.
    concurrency:
      group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Resolve and validate PR context
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.inputs.pr }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo '::error::Expected a positive PR number'; exit 1; }
          PR_JSON=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")
          jq -e --arg repo "$GITHUB_REPOSITORY" '
            .state == "open" and .draft == false and
            .head.repo.full_name == $repo and .user.login != "dependabot[bot]"
          ' <<< "$PR_JSON" > /dev/null || { echo '::error::PR is not eligible for review'; exit 1; }
          BASE_REF=$(jq -r '.base.ref' <<< "$PR_JSON")
          case "$BASE_REF" in main|dev|dev/*) ;; *) echo '::error::Unexpected PR base'; exit 1 ;; esac
          HEAD_SHA=$(jq -r '.head.sha' <<< "$PR_JSON")
          if [ -n "$EVENT_HEAD" ] && [ "$EVENT_HEAD" != "$HEAD_SHA" ]; then
            echo '::notice::PR head moved; the newer event must review it.'
            exit 1
          fi
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          jq -r '"head_ref=\(.head.ref)\nbase_ref=\(.base.ref)\nbase_sha=\(.base.sha)"' \
            <<< "$PR_JSON" >> "$GITHUB_OUTPUT"

      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0
          submodules: recursive
          # Fix pushes use the Claude App's authentication, not checkout's token.
          persist-credentials: false

      - name: Attach the checked-out commit to its PR branch
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          git check-ref-format --branch "$HEAD_REF"
          git switch -C "$HEAD_REF" "$HEAD_SHA"

      - name: Scope the review (whole PR, or the unreviewed push delta)
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          MODE=full RANGE="" LAST=""
          if [ "$ACTION" = synchronize ]; then
            # Markers identify the actual reviewed PR and SHA, including dispatch
            # runs whose workflow head/branch are different from the PR's head.
            # A bounded lookup can miss an older marker: full review is safe then.
            RUNS=$(gh run list --workflow claude-review.yml --limit 100 \
              --json databaseId --jq '.[].databaseId' 2>/dev/null) || RUNS=""
            for RUN in $RUNS; do
              MARKERS=$(gh run view "$RUN" --json jobs --jq \
                '.jobs[].steps[] | select(.conclusion == "success") | .name' \
                2>/dev/null) || continue
              while IFS= read -r STEP; do
                case "$STEP" in
                  "Reviewed PR $PR_NUMBER at "*) LAST=${STEP#"Reviewed PR $PR_NUMBER at "} ;;
                esac
              done <<< "$MARKERS"
              [ -z "$LAST" ] || break
            done
            # Never substitute event.before: failed/skipped/cancelled reviews may
            # have left earlier pushes unreviewed. Missing/rewritten/merged history
            # also requires the full PR, not a partial range that loses commits.
            if [[ "$LAST" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "$LAST^{commit}" 2>/dev/null; then
              if [ "$LAST" = "$HEAD_SHA" ]; then
                MODE=skip
              elif git merge-base --is-ancestor "$LAST" "$HEAD_SHA" \
                   && [ -z "$(git rev-list --merges "$LAST..$HEAD_SHA")" ]; then
                MODE=delta RANGE="$LAST..$HEAD_SHA"
              fi
            fi
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
          echo "::notice::Review scope: $MODE $RANGE"

      - name: Pick a cost-optimized, independent review model
        id: pick
        env:
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
        run: |
          MODEL="${CLAUDE_REVIEW_MODEL:-claude-opus-4-7}"
          case "$MODEL" in
            claude-opus-4-8*|claude-opus-5*|claude-fable-5*)
              echo '::warning::Authoring-tier model configured; using claude-opus-4-7.'
              MODEL=claude-opus-4-7 ;;
          esac
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "::notice::Independent review model: $MODEL"

      - name: Check for a Claude credential
        id: auth
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$OAUTH_TOKEN" ] || [ -n "$API_KEY" ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo '::warning::No Claude credential configured; skipping advisory review.'
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Restore trusted startup configuration for dispatch
        id: trusted
        if: >-
          github.event_name == 'workflow_dispatch' &&
          steps.auth.outputs.present == 'true' && steps.scope.outputs.mode != 'skip'
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
        run: |
          # Match the pinned action's restore-config.ts for PR events. Dispatch
          # lacks PR event context, so do this before Claude can load hooks/MCP.
          # These are fixed paths in a fresh CI checkout; rm unlinks a PR symlink
          # itself rather than following it. The index/HEAD stay the PR's versions.
          for CONFIG in .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky; do
            rm -rf -- "$CONFIG"
            if git cat-file -e "$BASE_SHA:$CONFIG" 2>/dev/null; then
              git restore --source="$BASE_SHA" --worktree -- "$CONFIG"
            fi
          done

      - name: Review + fix + comment
        id: review
        if: steps.auth.outputs.present == 'true' && steps.scope.outputs.mode != 'skip'
        uses: anthropics/claude-code-action@a26b07d8c778b0c43f64618e5fd29fd0f8af72e8 # v1
        env:
          CLAUDE_BRANCH: ${{ steps.pr.outputs.head_ref }}
        with:
          base_branch: ${{ steps.pr.outputs.base_ref }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN == '' && secrets.ANTHROPIC_API_KEY || '' }}
          prompt: |
            Review PR #${{ steps.pr.outputs.number }} in ${{ github.repository }}.
            Head: ${{ steps.pr.outputs.head_sha }} on branch ${{ steps.pr.outputs.head_ref }}.
            Base: ${{ steps.pr.outputs.base_sha }} (${{ steps.pr.outputs.base_ref }}).
            Scope: ${{ steps.scope.outputs.mode }} ${{ steps.scope.outputs.range }}.

            You are an independent reviewer. Read CLAUDE.md and
            specs/meta/META-SPEC.md first; they own repository instructions/state.
            Verify findings against files and real command output. Never claim a
            tool or test ran when it is unavailable on this runner.

            On a delta review, inspect ONLY git diff ${{ steps.scope.outputs.range }}
            at low effort. Earlier PR changes are context only: do not fix, repeat
            or raise findings outside this range. A full review inspects the entire
            PR diff against its base; pre-existing unrelated defects are not scope.

            For full reviews choose low/medium effort for small prose changes,
            high/max for core bridge/runtime code, autoload/, scenes/, project.godot,
            scripts/, specs/meta/, workflows, dependencies, the submodule pointer,
            or diffs larger than roughly 200 lines.
            Include security review when scoped changes affect bridge/network code,
            Python scripts, authentication, secrets, hooks, workflows or dependencies.
            Use an installed review skill if it honors this scope; otherwise review
            directly. Do not assume /code-review effort/--fix flags exist. Scope and
            effort must not be widened by a skill or by a previous review comment.

            Apply verified, scoped fixes and explain every fix in a PR comment.
            Preserve D-005 (the bridge is UI-independent) and D-016 (agent facts
            come from generated data). Do not hand-edit data/agents.json; use its
            generator when needed. Do not edit specs/meta/**, change/re-status a
            D-nnn decision, alter storyboard beats, reconcile conflicting governed
            documents, bump doc_set_version or the submodule pointer. Report those
            for the owner instead. Run relevant available checks, including
            python3 scripts/validate_specs.py for documentation changes.

            Stage only your intended fixes, commit them and explicitly git push
            HEAD to the PR branch using the action's Claude App authentication.
            The action does not automatically commit/push prompt-driven fixes.
            Startup config is restored from the trusted base: .claude, .mcp.json,
            .claude.json, .gitmodules, .ripgreprc, CLAUDE.md, CLAUDE.local.md and
            .husky. Never stage/commit those restoration differences or edit those
            paths. Review their PR versions with git show/diff and report findings.
            Do not force-push or push if the PR head moved since checkout; report
            that race instead. Keep changes to this PR's concern.

            Post findings/fix explanations inline using gh api on PR
            #${{ steps.pr.outputs.number }}; post one summary with fix commits,
            checks actually run, unverified checks, model and effort. On dispatch,
            use this explicit PR number rather than assuming pull_request context
            exists. If nothing needs changing, one short no-changes-needed summary
            is enough. Do not open duplicate issues or invent Jira keys.
            Sign: — Independent Claude review (<model>, effort <level>).
            This review is advisory; never block the merge.
          claude_args: |
            --model ${{ steps.pick.outputs.model }}
            ${{ steps.scope.outputs.mode == 'delta' && '--effort low' || '' }}
            --max-turns 60
            --dangerously-skip-permissions

      - name: Reviewed PR ${{ steps.pr.outputs.number }} at ${{ steps.pr.outputs.head_sha }}
        if: >-
          steps.review.outcome == 'success' &&
          steps.review.outputs.conclusion == 'success' &&
          steps.review.outputs.execution_file != ''
        run: echo '::notice::Completed review checkpoint recorded.'
