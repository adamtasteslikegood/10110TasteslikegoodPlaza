# Independent Claude review — advisory, cost-optimized, fail-open.
#
# Runs a SECOND, INDEPENDENT review of a PR in its own CI session, on a DIFFERENT
# and CHEAPER model than the authoring session. Sessions on this repo author in
# Opus 5 / Fable 5 (branch names are `claude/*`), so this reviewer defaults to
# Sonnet 5 — cheaper, and a genuinely different perspective rather than the same
# model grading its own homework.
#
# ADVISORY ONLY — never a required status check. `continue-on-error: true` so a
# flaky/absent key never blocks a merge, and the review step is SKIPPED entirely
# when no Claude credential is configured.
#
# ─────────────────────────────────────────────────────────────────────────────
# WHAT THIS REPO ACTUALLY NEEDS REVIEWED
#
# This is a documentation- and specification-governed repo, not an application.
# There is no Godot project, no Node, no server code. The defect classes that
# matter here are claims-about-state and governance bookkeeping, so the prompt
# below targets those instead of the usual code-review surface:
#
#   * Repository-state claims that have gone stale or were checked against an
#     endpoint that cannot see the answer.
#   * Decision-register bookkeeping — a `D-nnn` locked from a document whose
#     `authority` does not permit deciding.
#   * Cross-reference integrity — section cites, CHANGELOG self-consistency.
#   * The governed document set staying green under scripts/validate_specs.py.
#
# ─────────────────────────────────────────────────────────────────────────────
# NO AUTO-FIX ON GOVERNED DOCUMENTS — this is the important adaptation.
#
# specs/meta/META-SPEC.md §4 binds agents: "An agent may never pick a side
# unilaterally, and may never edit one document to match another as a drive-by."
# A reviewer bot running `--fix` across specs/ is exactly that drive-by. So this
# workflow COMMENTS by default and never edits.
#
# Mechanical fixes are opt-in per PR via the `claude-review-fix` label, and even
# then specs/meta/** stays off-limits — the constitution, the registry, the
# decision register and the driver doc are changed by humans or by a PR that
# argues for the change, never by a bot tidying up.
#
# ─────────────────────────────────────────────────────────────────────────────
# AUTH: prefers a Claude Pro/Max subscription OAuth token, falls back to an API key.
#   * CLAUDE_CODE_OAUTH_TOKEN (primary) — long-lived token from `claude setup-token`;
#     draws on your subscription's usage/rate limits.
#   * ANTHROPIC_API_KEY (fallback) — metered API billing; used when the OAuth secret
#     is absent. If BOTH are set, the action prefers the OAuth token.
# `id-token: write` is required so the action can mint the official Claude GitHub
# App token via OIDC to post comments — GitHub-side auth, independent of which
# Claude credential you use.
#
# PREREQUISITES (one-time, by a maintainer):
#   1. Add at least one Claude credential secret (Settings → Secrets → Actions):
#      CLAUDE_CODE_OAUTH_TOKEN (preferred) and/or ANTHROPIC_API_KEY. With neither,
#      the review step skips cleanly (advisory, no failure).
#   2. (recommended) Add repo variable  CLAUDE_REVIEW_MODEL  — must NOT be the
#      authoring tier. Verify the exact id at console.anthropic.com.
#   3. Create two labels:  `claude-review`  (request / re-request a review)
#                          `claude-review-fix`  (opt in to mechanical fixes)
#
# THIS WORKFLOW CANNOT REVIEW CHANGES TO ITSELF. claude-code-action validates
# that the workflow file is byte-identical to the copy on the default branch and
# skips otherwise:
#
#   "Workflow validation failed. The workflow file must exist and have identical
#    content to the version on the repository's default branch."
#
# That is a supply-chain control, not a bug — without it a PR could edit this
# file to exfiltrate CLAUDE_CODE_OAUTH_TOKEN and have CI run the edit. The job
# still reports success (advisory, continue-on-error), so READ THE STEP LOG, not
# the check mark, when verifying a change here.
#
# Consequences:
#   * The PR that introduced this file could not exercise it. First real run is
#     the first PR opened AFTER it lands on `dev`.
#   * Every future PR that edits this file will skip the review of itself. To
#     test a change, merge it to `dev`, then open a throwaway PR.
#
# ON SHA PINNING: this repo does NOT require it. `sha_pinning_required: false`,
# `allowed_actions: all`, and ci.yml uses plain tags (actions/checkout@v4). The
# SHA-pinned `uses:` lines in the gemini-*.yml workflows came from upstream
# templates, not from a policy here.
#
# The two SHAs below are pinned anyway, deliberately, and both were verified
# against upstream on 2026-07-26:
#   actions/checkout@9c091bb              = v7.0.0
#   anthropics/claude-code-action@44423bd = v1 (Claude Code 2.1.218)
# The second is the one that matters: `@v1` is a moving tag that has absorbed
# 180+ releases, so an unpinned reference changes the reviewer's behaviour
# without a commit here. Swap either for a tag if you prefer ci.yml's style.

name: Claude Review (independent model)

on:
  pull_request:
    # Auto once per PR (opened / un-drafted) + on-demand via the `claude-review`
    # label. Deliberately NOT `synchronize` — one review per PR keeps cost bounded;
    # re-request by re-applying the label. To review every push, add `synchronize`.
    types: [opened, ready_for_review, labeled]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      pr:
        description: 'PR number to review'
        required: true

# Least privilege at the top level, matching .github/workflows/ci.yml. Without it
# GITHUB_TOKEN inherits the repository default and CodeQL raises
# `actions/missing-workflow-permissions`, one alert per job. The job below widens
# it for itself rather than widening it for everything.
permissions:
  contents: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    name: Independent Claude review
    # Same-repo only (forks/Dependabot have no secrets → skip cleanly), non-bot,
    # non-draft; on `labeled` events only fire for the two review labels.
    #
    # `sender.type != 'Bot'` also keeps this from answering the gemini-*.yml
    # triage bots, which post on PRs in this repo and would otherwise trigger it.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]' &&
        github.event.sender.type != 'Bot' &&
        (
          github.event.action != 'labeled' ||
          github.event.label.name == 'claude-review' ||
          github.event.label.name == 'claude-review-fix'
        )
      )
    runs-on: ubuntu-latest
    continue-on-error: true # advisory — never blocks the merge

    permissions:
      contents: write # only exercised on the opt-in fix path; read otherwise
      pull-requests: write # post review comments
      issues: write # open follow-ups; fallback summary comment
      id-token: write # OIDC → official Claude GitHub App token

    steps:
      - name: Checkout PR head
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # For pull_request events this is the PR branch, so the opt-in fix path
          # can push back.
          ref: ${{ github.head_ref }}
          fetch-depth: 0 # full history — the reviewer inspects the commit graph
          # Kept ON deliberately, unlike ci.yml. Agent-count claims ("133 roles",
          # "141 files = 8 + 133") are a live review surface here and they are only
          # checkable against claude-code-tresor/subagents/. Costs ~a few seconds.
          submodules: recursive

      - name: Checkout dispatched PR
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass the untrusted dispatch input via env, never templated into the
          # shell source — otherwise a crafted `pr` value is a command-injection
          # sink (this job has contents/pull-requests/id-token: write).
          PR_NUMBER: ${{ github.event.inputs.pr }}
        run: gh pr checkout "$PR_NUMBER"

      - name: Pick a cost-optimized, independent review model
        id: pick
        env:
          # Via env, not templated into the shell source (same injection-safety
          # rule as the dispatch input above; a stray quote/backtick in the var
          # value would otherwise break or inject the script).
          CLAUDE_REVIEW_MODEL: ${{ vars.CLAUDE_REVIEW_MODEL }}
        run: |
          # Deterministic, always-cheaper-than-author selection. Authoring sessions
          # on this repo run Opus 5 / Fable 5, so the reviewer defaults to Sonnet 5:
          # cheaper, and a different model for a genuinely independent read.
          MODEL="${CLAUDE_REVIEW_MODEL:-claude-sonnet-5}"
          case "$MODEL" in
            claude-opus-5*|claude-fable-5*)
              echo "::warning::CLAUDE_REVIEW_MODEL=$MODEL is the authoring tier; using claude-sonnet-5 for a cheaper, independent review."
              MODEL="claude-sonnet-5" ;;
          esac
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "::notice::Independent review model: $MODEL"

      - name: Decide whether fixes are allowed on this PR
        id: mode
        env:
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          # Comment-only by default. META-SPEC §4 forbids an agent editing one
          # document to match another as a drive-by, and a bot running --fix over
          # specs/ is precisely that. Opt in per PR with `claude-review-fix`.
          if printf '%s' "$LABELS" | grep -q '"claude-review-fix"'; then
            echo "flags=--comment --fix" >> "$GITHUB_OUTPUT"
            echo "::notice::Fix mode ENABLED for this PR (label: claude-review-fix). specs/meta/** stays off-limits."
          else
            echo "flags=--comment" >> "$GITHUB_OUTPUT"
            echo "::notice::Comment-only mode. Add the claude-review-fix label to allow mechanical fixes."
          fi

      - name: Check for a Claude credential
        id: auth
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Advisory workflow: if no credential is configured, skip cleanly instead
          # of failing (forks/Dependabot also land here — they have no secrets).
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "::notice::Authenticating with CLAUDE_CODE_OAUTH_TOKEN (subscription)."
            echo "present=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$API_KEY" ]; then
            echo "::notice::Authenticating with ANTHROPIC_API_KEY (API billing)."
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY secret — skipping independent Claude review (advisory)."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Review + comment
        if: steps.auth.outputs.present == 'true'
        uses: anthropics/claude-code-action@44423bdec74b97d67543eb16c110546762c110b2 # v1
        with:
          # OAuth token (subscription) is primary; the action prefers it when set and
          # falls back to the API key when the OAuth secret is empty/unset.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            You are an INDEPENDENT reviewer running in CI on a different, cheaper
            model than the author's session. Review THIS pull request's diff against
            its base branch. Be rigorous. Do not fabricate issues, and do not pad the
            review to look thorough.

            Read CLAUDE.md and specs/meta/META-SPEC.md before reviewing. This repo is
            a governed document set, not an application — there is no Godot project
            and no Node. Never recommend commands that do not exist here.

            ## 1. Scope and effort

            Inspect the diff, then CHOOSE a reasoning effort:
              - `low` / `medium` — small prose edits, CHANGELOG entries, typos.
              - `high` / `max` — anything touching specs/meta/**, the decision
                register, scripts/validate_specs.py, .github/workflows/**, the
                submodule pointer, or a diff over ~200 lines.

            Always run the built-in `/code-review` at the effort you chose.
            ADDITIONALLY run `/security-review` when the diff touches
            .github/workflows/**, scripts/**, *.py, or the submodule pointer.

            ## 2. Verify claims about repository state — the highest-yield check

            This document set makes assertions about how the repository is
            configured. Those assertions rot. Three distinct failure modes, all of
            which have occurred here (see specs/branching-strategy.md §9):

              1. INHERITED and never checked — carried from
                 alirezarezvani/claude-code-tresor and plausible-sounding.
              2. CHECKED ONCE, THEN STALE — real evidence, cited, and the state
                 moved underneath it afterwards.
              3. CHECKED AGAINST AN ENDPOINT THAT CANNOT SEE THE ANSWER — the worst
                 one, because the response looks like evidence.

            When the diff asserts anything about branch protection, merge strategy,
            required checks, or labels, VERIFY IT LIVE:

            ```bash
            gh api repos/${{ github.repository }} \
              --jq '{merge:.allow_merge_commit, squash:.allow_squash_merge, rebase:.allow_rebase_merge, delete_branch:.delete_branch_on_merge}'
            gh api repos/${{ github.repository }}/rulesets
            gh api repos/${{ github.repository }}/rules/branches/dev
            gh api repos/${{ github.repository }}/rules/branches/main
            ```

            TRAP: `GET /repos/{owner}/{repo}/branches/{branch}/protection` returns
            `404 Branch not protected` for a branch protected by a RULESET. That 404
            means "no CLASSIC protection", not "no protection". Never conclude a
            branch is unprotected from that 404 alone. Check both surfaces.

            Required status checks are matched BY NAME. If the diff names required
            checks, read .github/workflows/ci.yml and confirm each name exists — the
            job names are `Validate Specs`, `Lint Python Bridge`, and
            `Export Godot 4 Prototype`.

            ## 3. Governance and authority

            - Run `python3 scripts/validate_specs.py` (stdlib only, no pip install).
              It must pass. Report the exact output.
            - Every governed doc needs frontmatter valid against
              specs/meta/spec-frontmatter.schema.json AND an entry in
              specs/meta/doc-registry.json (as `documents` or `exempt`). Any new .md
              under a governed tree that is registered in neither is a hard failure.
            - A new or changed `D-nnn` row: check the Origin document's `authority`
              actually permits deciding, per the META-SPEC §2 table. `derived`,
              `summary`, `research` and `historical` may originate NOTHING. A
              decision whose origin is not entitled must be `PROPOSED`, not `LOCKED`.
              This has already happened seven times — see issue #11 — so check it
              every time.
            - Tier ladder: tier 0 specs/meta/ governs, tier 1 docs/storyboard-week1.md
              owns concept, tier 2 docs/designs/* owns implementation, tier 3
              specs/roadmap.md + task-tracker sequence, tier 4 decides nothing.
              LOWER TIER WINS.
            - If two documents disagree, do NOT reconcile them. Say so, and say it
              belongs in the open-conflict register in
              specs/meta/spec-drivers-v0.2.5.md, per META-SPEC §4.
            - Agent counts derive from docs/agent-directory.md (D-017). 133 distinct
              roles; 141 files = 8 + 133. Both are right — flag any text that uses
              one number while meaning the other.

            ## 4. Cross-reference integrity

            - Section cites must resolve to a real heading. `§4.2` is wrong when the
              target is `## 4.` with a numbered list; write `§4, step 2`.
            - CHANGELOG.md: check the `[Unreleased]` section against itself. An entry
              opening a conflict while an older bullet in the same section still
              claims everything is resolved is a real defect.
            - The decision register table is ordered by ascending `D-nnn`.
            - Every relative link must resolve to a file that exists.

            ## 5. Claims about the git graph

            Verify the INFERENCE, not just the facts. `dev`'s head is a merge commit
            under `D-023`, so EVERY branch cut from `dev` sits on top of already-merged
            history — that observation alone proves nothing about whether a branch was
            improperly continued. The discriminating check is the first commit's
            parent:

            ```bash
            git log --format='%h parents=%p %s' -5 HEAD
            ```

            Parent == the base branch head means a fresh branch. A finding built on
            individually-true facts can still be wrong; check the one thing that
            separates the two explanations before you post.

            ## 6. Python

            Anything under scripts/ or *.py must pass
            `flake8 . --select=E9,F63,F7,F82`. generate_report.py and
            post_to_confluence.py read ./.env directly and raise KeyError when a var
            is missing — that is known and intentional, do not flag it.

            ## 7. Output

            Post each finding as an INLINE comment on the changed line, formatted:

                **[CRITICAL|INFORMATIONAL] (confidence: N/10)** — one-line problem

            Then the evidence you actually ran, then the fix. Rules:
              - Quote the specific line or command output that motivates the finding.
                If you cannot quote it, you have not verified it — drop the finding or
                mark it below 7/10 and say what you could not check.
              - GitHub only accepts inline comments on lines inside a diff hunk. For
                anything outside, anchor to the nearest in-diff line and say where the
                real line is.
              - You cannot REQUEST_CHANGES on a PR authored by the same account. Post
                as COMMENT.
              - State plainly what you could NOT verify rather than implying coverage.

            Finish with ONE summary comment: each finding as a bullet, the validator
            output, and the model + effort used, signed:
            `— Independent Claude review (<model>, effort <level>)`.

            If nothing is worth raising, post a single short "no changes needed"
            comment. This review is ADVISORY — never block the merge.

            ## 8. Follow-ups

            Do not leave real remaining work in a comment thread where it dies with
            the PR. Open a GitHub ISSUE for anything still to be done, and a
            DISCUSSION for settled knowledge worth keeping that is not work. Link
            them from the summary comment. Check open issues first — do not duplicate
            #11 (meta-layer authority), #12, #13 or #14.

            ## 9. Fix mode

            Fixes are ${{ steps.mode.outputs.flags == '--comment --fix' && 'ENABLED' || 'DISABLED' }} on this PR.

            If DISABLED: comment only. Do not edit any file.

            If ENABLED: you may apply MECHANICAL fixes only — typos, broken links,
            wrong section cites, table ordering, stale dates. You must NEVER:
              - edit anything under specs/meta/**;
              - add, remove, reword or re-status a `D-nnn` row;
              - change a storyboard beat in docs/storyboard-week1.md;
              - reconcile two documents that disagree;
              - bump doc_set_version or the submodule pointer.
            Those are human decisions. Raise them as comments instead. Every fix you
            apply needs its own inline comment saying what changed and why.
          claude_args: |
            --model ${{ steps.pick.outputs.model }}
            ${{ steps.mode.outputs.flags }}
            --max-turns 60
            --dangerously-skip-permissions
