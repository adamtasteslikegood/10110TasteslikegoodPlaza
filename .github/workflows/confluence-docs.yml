name: Confluence Source Mirrors

on:
  push:
    branches: [dev, main]
    paths:
      - 'docs/**'
      - 'specs/**'
      - 'Docs/**'
      - '*.md'
      - 'scripts/pm/publish_docs.py'
      - 'scripts/pm/_confluence_format.py'
      - 'scripts/pm/_atlassian_guard.py'
      - 'scripts/pm/requirements.txt'
      - '.github/workflows/confluence-docs.yml'
  pull_request:
    branches: [dev, main]
    paths:
      - 'scripts/pm/**'
      - 'tests/test_publish_docs.py'
      - 'docs/delivery-coordinates.md'
      - 'specs/meta/doc-registry.json'
      - '.github/workflows/confluence-docs.yml'
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply to Confluence (false produces a credential-free plan)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Confluence Publisher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pm/requirements.txt
      - name: Install publisher dependencies
        run: python -m pip install -r scripts/pm/requirements.txt pytest
      - name: Test publisher
        run: python -m pytest tests/test_publish_docs.py -q

  publish:
    name: Publish committed dev documents
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Both trigger branches share one destination set. Never cancel a writer
      # halfway through updating it; a queued run checks out the newest dev.
      group: plaza-confluence-source-mirrors
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/pm/requirements.txt
      - name: Install publisher dependencies
        run: python -m pip install -r scripts/pm/requirements.txt
      - name: Validate the source document set
        run: python scripts/validate_specs.py
      - name: Produce publication plan
        run: python scripts/pm/publish_docs.py --dry-run > /tmp/confluence-docs-plan.json
      - name: Save publication plan
        uses: actions/upload-artifact@v4
        with:
          name: confluence-docs-plan
          path: /tmp/confluence-docs-plan.json
      - name: Publish source mirrors
        if: github.event_name == 'push' || inputs.apply
        env:
          ATLASSIAN_API_TOKEN_BASE64: ${{ secrets.ATLASSIAN_API_TOKEN_BASE64 }}
        run: python scripts/pm/publish_docs.py --apply
