name: Issue Triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Label by pattern
        uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title;
            const body = context.payload.issue.body || '';
            const labels = [];

            if (title.match(/no PLZG|no CHANGELOG|has no.*entry/i)) {
              labels.push('ci-review-followup');
            }
            if (title.match(/bridge|domain.session|websocket/i)) {
              labels.push('bridge');
            }
            if (title.match(/CLAUDE\.md|doc|spec|META-SPEC/i)) {
              labels.push('documentation');
            }
            if (title.match(/PR #\d+/)) {
              labels.push('pr-followup');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: labels
              });
            }
