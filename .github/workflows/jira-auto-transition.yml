name: Jira Auto-Transition

on:
  pull_request:
    types: [closed]
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: read

jobs:
  transition:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extract PLZG keys from PR title
        id: keys
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          KEYS=$(printf '%s' "$PR_TITLE" | grep -oP '\bPLZG-[0-9]+\b' | sort -u | tr '\n' ' ')
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"
          if [ -z "$KEYS" ]; then
            echo "No PLZG keys found in PR title: $PR_TITLE"
          else
            echo "Found keys: $KEYS"
          fi

      - name: Transition issues to Done
        if: steps.keys.outputs.keys != ''
        env:
          ATLASSIAN_EMAIL: ${{ secrets.ATLASSIAN_EMAIL }}
          ATLASSIAN_API_TOKEN: ${{ secrets.ATLASSIAN_API_TOKEN }}
          ATLASSIAN_URL: https://tasteslikegood.atlassian.net
          ISSUE_KEYS: ${{ steps.keys.outputs.keys }}
        run: |
          for KEY in $ISSUE_KEYS; do
            echo "Processing $KEY..."

            HTTP_RESP=$(mktemp)
            HTTP_CODE=$(curl -s -o "$HTTP_RESP" -w "%{http_code}" \
              -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
              "$ATLASSIAN_URL/rest/api/3/issue/$KEY/transitions" \
              -H "Accept: application/json")

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "  $KEY: failed to fetch transitions (HTTP $HTTP_CODE)"
              rm -f "$HTTP_RESP"
              continue
            fi

            DONE_ID=$(cat "$HTTP_RESP" | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              for t in data.get('transitions', []):
                  name = t.get('name', '').lower()
                  if name in ('done', 'closed', 'resolved'):
                      print(t['id'])
                      break
              else:
                  print('')
          except Exception:
              print('')
          ")
            rm -f "$HTTP_RESP"

            if [ -z "$DONE_ID" ]; then
              echo "  No Done/Closed/Resolved transition found for $KEY — skipping"
              continue
            fi

            TRANS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -u "$ATLASSIAN_EMAIL:$ATLASSIAN_API_TOKEN" \
              -X POST "$ATLASSIAN_URL/rest/api/3/issue/$KEY/transitions" \
              -H "Content-Type: application/json" \
              -d "{\"transition\":{\"id\":\"$DONE_ID\"}}")

            if [ "$TRANS_CODE" = "204" ]; then
              echo "  $KEY transitioned to Done (transition $DONE_ID)"
            else
              echo "  $KEY transition failed (HTTP $TRANS_CODE)"
            fi
          done
