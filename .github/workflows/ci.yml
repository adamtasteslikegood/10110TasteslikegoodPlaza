name: CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

# Least privilege for the whole workflow. Every job here only reads the
# repository: checkout, set up Python, run a validator or a linter. Nothing
# writes to the repo, posts a comment, or mints a token, so no job needs more
# than `contents: read`.
#
# Without this, GITHUB_TOKEN inherits the repository default, which may be
# read/write. CodeQL flags that as actions/missing-workflow-permissions - one
# alert per job. claude-review.yml already declares permissions at the job
# level; this file was the only one with none at any level.
#
# A job that later needs more (publishing a release, commenting on a PR) should
# declare its own `permissions:` block rather than widening this one.
permissions:
  contents: read

jobs:
  validate-specs:
    name: Validate Specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Standard library only - no pip install step by design. See
      # specs/meta/META-SPEC.md for the rules this enforces.
      - name: Validate governed document set
        run: python3 scripts/validate_specs.py

  validate-delivery-coordinates:
    name: Validate Delivery Coordinates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Sibling of Validate Specs: standard library only, no pip install step.
      # Enforces the Sprint 2 definition of done (specs/sprint-2-charter.md
      # section 1) -- nothing live routes to the deprecated Jira board, and the
      # committed PLZG snapshot still reports measurable flow.
      - name: Validate delivery coordinates
        run: python3 scripts/validate_delivery_coordinates.py

  check-sync-matrix:
    name: Check Sync Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Builds its own bare origin and clones, so it needs no network and does
      # not depend on this checkout's refspec -- which is itself one of the
      # things it tests (PLZG-124).
      - name: Run the check_sync regression matrix
        run: tests/check_sync_matrix.sh

  spec-enforcement-matrix:
    name: Spec Enforcement Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The non-vacuity gate for the D-027 enforcement checks. `Validate Specs`
      # exiting 0 is necessary and not sufficient: during PLZG-134 three of
      # those five checks were found checking nothing while it stayed green.
      # This builds its own three-document fixture set in a temp dir -- no
      # network, no submodule, and it never touches the checkout -- then asserts
      # the validator FAILS on each broken case, with the expected message.
      - name: Run the enforcement-axis matrix
        run: tests/spec_enforcement_matrix.sh

  validate-agent-data:
    name: Validate Agent Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The generator reads claude-code-tresor/subagents; without the
          # submodule there is nothing to check against.
          submodules: recursive

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # PyYAML, unlike the stdlib-only Validate Specs job. This parses upstream
      # frontmatter (block sequences, nested examples, three tools syntaxes),
      # not our own controlled subset - see the module docstring.
      - name: Install PyYAML
        run: python -m pip install --upgrade pip pyyaml

      # D-016: agents.json is generated, never hand-edited. This fails if the
      # committed file has drifted from the submodule.
      - name: Verify data/agents.json matches the submodule
        run: python3 scripts/generate_agents_json.py --check

  python-lint:
    name: Lint Python Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black websockets
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
      - name: Lint with Black
        run: |
          black --check .
          
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  bridge-tests:
    name: Bridge Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest websockets
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run bridge tests
        run: pytest bridge/tests/ -v

  godot-build:
    name: Export Godot 4 Prototype
    runs-on: ubuntu-latest
    # Imports the project and runs the headless smoke test. This job used to echo
    # "Godot project not initialized yet" and go green, which is indistinguishable
    # from a passing build -- the same false-green shape as the review workflow in
    # PR #17. It now fails when a scene, a script or the agent data is broken.
    #
    # No export templates are downloaded: the ~80MB editor build is enough to
    # import and run headless, where a web export would pull ~1GB per run to
    # produce an artifact nothing consumes yet. Wire the export when something
    # needs to consume it.
    env:
      GODOT_VERSION: 4.7.1
      # sha512 of Godot_v4.7.1-stable_linux.x86_64.zip, from the release's
      # SHA512-SUMS.txt. Pinned here rather than fetched at run time on purpose:
      # a sums file pulled from the same origin as the binary would be swapped by
      # anyone able to swap the binary. A hash committed to git is reviewable, and
      # changing it shows up in a diff.
      #
      # To bump: update GODOT_VERSION, then
      #   curl -fsSL https://github.com/godotengine/godot/releases/download/<ver>-stable/SHA512-SUMS.txt \
      #     | grep linux.x86_64.zip
      GODOT_SHA512: 4ccdab7a48eeccbe8819a2fc1f6262f8d72065d98601bcb3743fcbd7ebd39f373758a788ee3293a05ec5b2c48538266c437404312e372225cd2df273945a2de9
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot binary
        uses: actions/cache@v4
        id: godot-cache
        with:
          path: /usr/local/bin/godot
          key: godot-${{ env.GODOT_VERSION }}-linux-x86_64

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # godotengine/godot GitHub releases -- downloads.tuxfamily.org, which the
          # previous stub's comment pointed at, no longer serves Godot at all.
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -fsSL -o godot.zip "$url"
          echo "${GODOT_SHA512}  godot.zip" | sha512sum -c -
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          chmod +x /usr/local/bin/godot

      - name: Verify Godot version
        run: godot --version

      - name: Import project
        run: godot --headless --import

      - name: Headless smoke test
        run: godot --headless tests/smoke_test.tscn
